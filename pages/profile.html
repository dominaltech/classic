<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Manage your customer delivery details — Classic Collection Solapur (classicsolapur.com)." />
    <title>My Profile & Address | Classic Collection Solapur</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/css/global.css" />
    <script type="module" src="/js/pages/profile.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#app-main">Skip to content</a>
    <div id="app-header"></div>
    <main id="app-main" class="app-main auth-main" tabindex="-1">
      <section class="auth-layout" aria-labelledby="profile-title">
        <div class="auth-intro">
          <p class="eyebrow" style="font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--color-text-muted); font-weight: 700;">Classic Collection Solapur</p>
          <h1 class="auth-intro__title" id="profile-title" style="font-family: var(--font-family-heading);">Delivery Profile</h1>
          <p class="auth-intro__copy">Keep your shipping name, address, and phone number updated. These details are required before adding to cart and placing orders.</p>
        </div>

        <form class="auth-card" id="profile-form" novalidate>
          <div class="form-alert" data-form-error hidden>
            <span data-form-error-text></span>
            <button class="button button--ghost button--small" type="button" data-retry>Retry</button>
          </div>

          <div class="form-field">
            <label class="form-label" for="profile-name">Full name</label>
            <input
              class="text-input"
              id="profile-name"
              name="name"
              type="text"
              autocomplete="name"
              placeholder="Your full name"
              required
            />
            <p class="form-field__error" data-field-error="name"></p>
          </div>

          <div class="form-field">
            <label class="form-label" for="profile-address">Delivery address</label>
            <textarea
              class="text-input textarea-input"
              id="profile-address"
              name="address"
              rows="3"
              autocomplete="street-address"
              placeholder="House/flat no, street, landmark, area, city, pincode"
              required
            ></textarea>
            <p class="form-field__error" data-field-error="address"></p>
          </div>

          <div class="form-field">
            <label class="form-label" for="profile-phone">Phone number</label>
            <input
              class="text-input"
              id="profile-phone"
              name="phone"
              type="tel"
              autocomplete="tel"
              inputmode="tel"
              placeholder="10-digit phone number"
              required
            />
            <p class="form-field__error" data-field-error="phone"></p>
          </div>

          <button class="button button--full" id="profile-submit" type="submit">Save Profile Details</button>
        </form>
      </section>
    </main>
    <div id="app-footer"></div>
    <div id="app-bottom-nav"></div>
    <div id="app-toast" class="toast-region" aria-live="polite" aria-relevant="additions removals"></div>
  </body>
</html>
