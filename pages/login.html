<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Log in to Classic Collection Solapur (classicsolapur.com)." />
    <title>Customer Login | Classic Collection Solapur</title>
    <link rel="stylesheet" href="/css/global.css" />
    <script type="module" src="/js/pages/login.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#app-main">Skip to content</a>
    <div id="app-header"></div>
    <main id="app-main" class="app-main auth-main" tabindex="-1">
      <section class="auth-layout" aria-labelledby="login-title">
        <div class="auth-intro">
          <p class="eyebrow" style="font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--color-text-muted); font-weight: 700;">Classic Collection Solapur</p>
          <h1 class="auth-intro__title" id="login-title" style="font-family: var(--font-family-heading);">Welcome back to Classic Collection</h1>
          <p class="auth-intro__copy">Access your shopping bag, save your shipping address, and track your material order delivery live.</p>
        </div>

        <form class="auth-card" id="login-form" novalidate>
          <div class="form-alert" data-form-error hidden></div>

          <div class="form-field">
            <label class="form-label" for="login-email">Email</label>
            <input
              class="text-input"
              id="login-email"
              name="email"
              type="email"
              autocomplete="email"
              inputmode="email"
              placeholder="you@example.com"
              required
            />
            <p class="form-field__error" data-field-error="email"></p>
          </div>

          <div class="form-field">
            <label class="form-label" for="login-password">Password</label>
            <input
              class="text-input"
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter password"
              required
            />
            <p class="form-field__error" data-field-error="password"></p>
          </div>

          <button class="button button--full" id="login-submit" type="submit">Log In</button>

          <p class="auth-card__switch">
            Need an account?
            <a class="auth-link" href="/pages/signup.html">Create one here</a>
          </p>
        </form>
      </section>
    </main>
    <div id="app-footer"></div>
    <div id="app-bottom-nav"></div>
    <div id="app-toast" class="toast-region" aria-live="polite" aria-relevant="additions removals"></div>
  </body>
</html>
