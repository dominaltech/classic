<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create your Classic Collection Solapur account." />
    <title>Customer Sign Up | Classic Collection Solapur</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/css/global.css" />
    <script type="module" src="/js/pages/signup.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#app-main">Skip to content</a>
    <div id="app-header"></div>
    <main id="app-main" class="app-main auth-main" tabindex="-1">
      <section class="auth-layout" aria-labelledby="signup-title">
        <div class="auth-intro">
          <p class="eyebrow" style="font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--color-text-muted); font-weight: 700;">Classic Collection Solapur</p>
          <h1 class="auth-intro__title" id="signup-title" style="font-family: var(--font-family-heading);">Create Customer Account</h1>
          <p class="auth-intro__copy">Register with your name, phone, and email to save your delivery addresses and track cloth material orders.</p>
        </div>

        <form class="auth-card" id="signup-form" novalidate>
          <div class="form-alert" data-form-error hidden></div>

          <div class="form-field">
            <label class="form-label" for="signup-name">Full name</label>
            <input
              class="text-input"
              id="signup-name"
              name="name"
              type="text"
              autocomplete="name"
              placeholder="Your full name"
              required
            />
            <p class="form-field__error" data-field-error="name"></p>
          </div>

          <div class="form-field">
            <label class="form-label" for="signup-email">Email</label>
            <input
              class="text-input"
              id="signup-email"
              name="email"
              type="email"
              autocomplete="email"
              inputmode="email"
              placeholder="you@example.com"
              required
            />
            <p class="form-field__error" data-field-error="email"></p>
          </div>

          <div class="form-field">
            <label class="form-label" for="signup-phone">Phone number</label>
            <input
              class="text-input"
              id="signup-phone"
              name="phone"
              type="tel"
              autocomplete="tel"
              inputmode="tel"
              placeholder="10-digit mobile number"
            />
            <p class="form-field__error" data-field-error="phone"></p>
          </div>

          <div class="form-field">
            <label class="form-label" for="signup-password">Password</label>
            <input
              class="text-input"
              id="signup-password"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="At least 6 characters"
              required
            />
            <p class="form-field__error" data-field-error="password"></p>
          </div>

          <button class="button button--full" id="signup-submit" type="submit">Create Account</button>

          <p class="auth-card__switch">
            Already registered?
            <a class="auth-link" href="/pages/login.html">Log in to your account</a>
          </p>
        </form>
      </section>
    </main>
    <div id="app-footer"></div>
    <div id="app-bottom-nav"></div>
    <div id="app-toast" class="toast-region" aria-live="polite" aria-relevant="additions removals"></div>
  </body>
</html>
