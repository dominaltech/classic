<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Order details and delivery status — Classic Collection Solapur (classicsolapur.com)." />
    <title>Order Details | Classic Collection Solapur</title>
    <link rel="stylesheet" href="/css/global.css" />
    <script type="module" src="/js/pages/order-detail.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#app-main">Skip to content</a>
    <div id="app-header"></div>
    <main id="app-main" class="app-main" tabindex="-1" style="max-width: 1280px; margin: 24px auto 64px; padding: 0 24px;">
      <nav class="breadcrumb" aria-label="Breadcrumb" style="margin-bottom: 24px;">
        <a class="breadcrumb__link" href="/pages/orders.html">Orders</a>
        <span class="breadcrumb__separator" aria-hidden="true">/</span>
        <span class="breadcrumb__current" data-breadcrumb-current aria-current="page">Order Status</span>
      </nav>

      <section class="listing-head" aria-labelledby="order-title" style="margin-bottom: 24px;">
        <p class="eyebrow" style="font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--color-text-muted); font-weight: 700;">Classic Collection Solapur</p>
        <div class="listing-head__row" style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px;">
          <div>
            <h1 class="listing-title" id="order-title" data-order-title style="font-family: var(--font-family-heading); font-size: clamp(1.8rem, 3.5vw, 2.5rem); text-transform: uppercase; margin-bottom: 4px;">Order Details</h1>
            <p class="listing-subtitle" data-order-placed style="color: var(--color-text-muted); font-size: 14px;"></p>
          </div>
          <div class="listing-head__chip" data-order-chip></div>
        </div>
      </section>

      <div class="cart-skeleton" data-order-skeleton hidden></div>

      <div class="checkout-grid" data-order-content hidden>
        <div class="checkout-grid__main">
          <section aria-labelledby="timeline-heading" style="margin-bottom: 32px;">
            <h2 class="checkout-section-title" id="timeline-heading">Status Timeline</h2>
            <ol class="order-timeline" data-timeline></ol>
          </section>

          <section aria-labelledby="order-items-heading">
            <h2 class="checkout-section-title" id="order-items-heading">Order Fabric Items</h2>
            <div class="order-items" data-order-items></div>
          </section>
        </div>

        <div class="checkout-summary-stack">
          <div class="cart-summary" aria-label="Order totals" style="background: var(--color-surface-subtle); border: 1px solid var(--color-border); border-radius: 8px; padding: 24px; margin-bottom: 24px;">
            <div class="cart-summary__row" style="display: flex; justify-content: space-between; margin-bottom: 8px;">
              <span class="cart-summary__label">Subtotal</span>
              <strong class="cart-summary__value cart-summary__value--small" data-order-subtotal>₹0</strong>
            </div>
            <div class="cart-summary__row" style="display: flex; justify-content: space-between; font-size: 1.25rem;">
              <span class="cart-summary__label">Total</span>
              <strong class="cart-summary__value" data-order-total>₹0</strong>
            </div>
          </div>

          <section class="shipping-card" aria-labelledby="order-shipping-heading" style="background: var(--color-surface-subtle); border: 1px solid var(--color-border); border-radius: 8px; padding: 24px;">
            <h2 class="checkout-section-title" id="order-shipping-heading" style="margin-bottom: 16px;">Shipping Address Snapshot</h2>
            <dl class="shipping-card__rows">
              <div class="shipping-card__row">
                <dt class="shipping-card__label">Recipient</dt>
                <dd class="shipping-card__value" data-order-shipping-name></dd>
              </div>
              <div class="shipping-card__row">
                <dt class="shipping-card__label">Address</dt>
                <dd class="shipping-card__value" data-order-shipping-address></dd>
              </div>
              <div class="shipping-card__row">
                <dt class="shipping-card__label">Phone</dt>
                <dd class="shipping-card__value" data-order-shipping-phone></dd>
              </div>
            </dl>
          </section>
        </div>
      </div>

      <div class="listing-state" data-order-state hidden></div>
    </main>
    <div id="app-footer"></div>
    <div id="app-bottom-nav"></div>
    <div id="app-toast" class="toast-region" aria-live="polite" aria-relevant="additions removals"></div>
  </body>
</html>
