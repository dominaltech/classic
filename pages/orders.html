<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Track your material orders — Classic Collection Solapur (classicsolapur.com)." />
    <title>My Orders | Classic Collection Solapur</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/css/global.css" />
    <script type="module" src="/js/pages/orders.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#app-main">Skip to content</a>
    <div id="app-header"></div>
    <main id="app-main" class="app-main" tabindex="-1" style="max-width: 1280px; margin: 24px auto 64px; padding: 0 24px;">
      <section class="listing-head" aria-labelledby="orders-title" style="margin-bottom: 24px;">
        <p class="eyebrow" style="font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--color-text-muted); font-weight: 700;">Classic Collection Solapur</p>
        <div class="listing-head__row" style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px;">
          <div>
            <h1 class="listing-title" id="orders-title" style="font-family: var(--font-family-heading); font-size: clamp(1.8rem, 3.5vw, 2.5rem); text-transform: uppercase; margin-bottom: 4px;">Order History</h1>
            <p class="listing-subtitle" style="color: var(--color-text-muted); font-size: 14px;">Track live status from confirmation to doorstep delivery.</p>
          </div>
          <p class="listing-count" data-orders-status aria-live="polite" style="font-size: 13px; font-weight: 600;"></p>
        </div>
      </section>

      <section class="cart-section" aria-label="Order history">
        <div class="cart-skeleton" data-orders-skeleton hidden></div>
        <div class="order-list" data-orders-list></div>
        <div class="listing-state" data-orders-state hidden></div>

        <nav class="pagination" aria-label="Order pagination" data-pagination hidden style="margin-top: 32px; display: flex; justify-content: center; gap: 16px; align-items: center;">
          <button class="button button--ghost" type="button" data-prev-page>Previous</button>
          <p class="pagination__status" data-pagination-status style="font-size: 14px; font-weight: 600;"></p>
          <button class="button button--ghost" type="button" data-next-page>Next</button>
        </nav>
      </section>
    </main>
    <div id="app-footer"></div>
    <div id="app-bottom-nav"></div>
    <div id="app-toast" class="toast-region" aria-live="polite" aria-relevant="additions removals"></div>
  </body>
</html>
