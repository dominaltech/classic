<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your Classic Collection Solapur order has been placed." />
    <title>Order Confirmed | Classic Collection Solapur</title>
    <link rel="stylesheet" href="/css/global.css" />
    <script type="module" src="/js/pages/order-confirmation.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#app-main">Skip to content</a>
    <div id="app-header"></div>
    <main id="app-main" class="app-main" tabindex="-1" style="max-width: 1280px; margin: 24px auto 64px; padding: 0 24px;">
      <section class="confirmation-hero" aria-labelledby="confirmation-title" data-confirmation-hero hidden style="text-align: center; margin-bottom: 36px;">
        <div class="confirmation-hero__icon" data-confirmation-icon aria-hidden="true"></div>
        <p class="eyebrow" style="font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--color-text-muted); font-weight: 700;">Order Confirmed</p>
        <h1 class="listing-title" id="confirmation-title" style="font-family: var(--font-family-heading); font-size: clamp(2rem, 4vw, 2.8rem); text-transform: uppercase;">Thank you — your order is placed</h1>
        <p class="confirmation-hero__meta" style="color: var(--color-text-muted); font-size: 14px; margin: 8px 0 16px;">
          Order <strong data-order-ref></strong>
          <span aria-hidden="true"> · </span>
          Placed on <span data-order-date></span>
        </p>
        <div data-order-chip></div>
      </section>

      <div class="cart-skeleton" data-confirmation-skeleton hidden></div>

      <div class="checkout-grid" data-confirmation-content hidden>
        <div class="checkout-grid__main">
          <section aria-labelledby="confirm-items-heading">
            <h2 class="checkout-section-title" id="confirm-items-heading">Items in this order</h2>
            <div class="order-items" data-confirmation-items></div>
          </section>

          <section class="shipping-card" aria-labelledby="confirm-shipping-heading" style="background: var(--color-surface-subtle); border: 1px solid var(--color-border); border-radius: 8px; padding: 24px; margin-top: 24px;">
            <div class="shipping-card__head" style="margin-bottom: 16px;">
              <h2 class="checkout-section-title" id="confirm-shipping-heading">Shipping details</h2>
            </div>
            <dl class="shipping-card__rows">
              <div class="shipping-card__row">
                <dt class="shipping-card__label">Name</dt>
                <dd class="shipping-card__value" data-shipping-name></dd>
              </div>
              <div class="shipping-card__row">
                <dt class="shipping-card__label">Address</dt>
                <dd class="shipping-card__value" data-shipping-address></dd>
              </div>
              <div class="shipping-card__row">
                <dt class="shipping-card__label">Phone</dt>
                <dd class="shipping-card__value" data-shipping-phone></dd>
              </div>
            </dl>
          </section>
        </div>

        <div class="cart-summary checkout-summary" aria-label="Order summary" style="background: var(--color-surface-subtle); border: 1px solid var(--color-border); border-radius: 8px; padding: 24px;">
          <div class="cart-summary__row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <span class="cart-summary__label" data-confirmation-total-label>Total</span>
            <strong class="cart-summary__value" data-confirmation-total style="font-size: 1.5rem;">₹0</strong>
          </div>
          <p class="cart-summary__note" style="font-size: 12px; color: var(--color-text-muted); margin-bottom: 24px;">Thank you for shopping at Classic Collection Solapur (classicsolapur.com).</p>
          <div class="cart-summary__actions" style="display: flex; flex-direction: column; gap: 10px;">
            <a class="button button--full" href="/pages/orders.html">View My Orders</a>
            <a class="button button--ghost button--full" href="/pages/listing.html">Continue Shopping</a>
          </div>
        </div>
      </div>

      <div class="listing-state" data-confirmation-state hidden></div>
    </main>
    <div id="app-footer"></div>
    <div id="app-bottom-nav"></div>
    <div id="app-toast" class="toast-region" aria-live="polite" aria-relevant="additions removals"></div>
  </body>
</html>
